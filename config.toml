[project]
title = "OPM Literature Intelligence"
timezone = "Asia/Shanghai"
max_report_papers = 7
lookback_days = 30
provider = "opencode-zen"
base_url = "https://opencode.ai/zen/go/v1"
model = "deepseek-v4-flash"
max_output_tokens = 4500
abstract_max_chars = 1800

[sources]
pubmed = true
arxiv = true
pubmed_retmax = 80
arxiv_max_results = 50

[search]
pubmed_query = '''
(
  "optically pumped magnetometer"[Title/Abstract] OR
  "optically pumped magnetometry"[Title/Abstract] OR
  OPM-MEG[Title/Abstract] OR OPM-MCG[Title/Abstract] OR
  magnetocardiography[Title/Abstract] OR magnetoencephalography[Title/Abstract] OR
  "spin-exchange relaxation-free"[Title/Abstract] OR
  "atomic magnetometer"[Title/Abstract] OR
  "quantum magnetometer"[Title/Abstract] OR
  "NV center"[Title/Abstract] OR
  OPM[Title/Abstract] OR
  biomagnetic[Title/Abstract] OR
  "wearable magnetometer"[Title/Abstract] OR
  "brain-heart axis"[Title/Abstract] OR
  "artifact correction"[Title/Abstract]
)
'''
arxiv_query = '''
all:"optically pumped magnetometer" OR all:"OPM-MEG" OR all:"OPM-MCG" OR
all:magnetocardiography OR all:magnetoencephalography OR
all:"atomic magnetometer" OR all:"quantum magnetometer" OR all:"NV center" OR
all:OPM OR all:biomagnetic OR all:"wearable magnetometer" OR
all:"brain-heart axis" OR all:"artifact correction"
'''

[scoring]
s_threshold = 7
a_threshold = 5
s_anchor_terms = [
  "optically pumped magnetometer",
  "optically pumped magnetometry",
  "opm-meg",
  "opm-mcg",
  "wearable meg",
  "on-scalp meg",
]

[scoring.s_terms]
"optically pumped magnetometer" = 5
"optically pumped magnetometry" = 5
"opm-meg" = 5
"opm-mcg" = 5
"wearable meg" = 4
